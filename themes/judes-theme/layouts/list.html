{{ define "main" }}
  <h1>{{ .Title }}</h1>
  {{ .Content }}
  <ul class="post-list">
    {{ range .Pages }}
      <li>
        <a href="{{ .RelPermalink }}">
          <span class="post-title">{{ .Title }}</span>
          <span class="post-date">{{ .Date.Format "January 2, 2006" }}</span>
        </a>
      </li>
    {{ end }}
  </ul>
{{ end }}
