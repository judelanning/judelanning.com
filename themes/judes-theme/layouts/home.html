{{ define "main" }}
  {{ .Content }}
  {{ $posts := where site.RegularPages "Section" "posts" }}
  {{ if $posts }}
    <h2>Recent Posts</h2>
    <ul class="post-list">
      {{ range first 10 $posts }}
        <li>
          <a href="{{ .RelPermalink }}">
            <span class="post-title">{{ .Title }}</span>
            <span class="post-date">{{ .Date.Format "January 2, 2006" }}</span>
          </a>
        </li>
      {{ end }}
    </ul>
  {{ end }}
{{ end }}
